services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: chance
      POSTGRES_DB: chance
      POSTGRES_PASSWORD: ${CHANCE_POSTGRES_PASSWORD:?Set CHANCE_POSTGRES_PASSWORD in .env}
    volumes:
      - visitor-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chance -d chance"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      PGDATABASE_URL: postgresql://chance:${CHANCE_POSTGRES_PASSWORD}@db:5432/chance
      VISITOR_DEPLOYMENT_ENABLED: "1"
      MENGNIU_AGENT_API_TOKEN: ${MENGNIU_AGENT_API_TOKEN:?Set MENGNIU_AGENT_API_TOKEN in .env}
      MENGNIU_ALLOW_MODEL_CALLS: ${MENGNIU_ALLOW_MODEL_CALLS:-0}
      COZE_WORKLOAD_IDENTITY_API_KEY: ${COZE_WORKLOAD_IDENTITY_API_KEY:-}
      COZE_INTEGRATION_MODEL_BASE_URL: ${COZE_INTEGRATION_MODEL_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: .
    environment:
      PORT: "5000"
      MENGNIU_AGENT_UPSTREAM_URL: http://backend:8000/visitor/v1
      MENGNIU_AGENT_API_TOKEN: ${MENGNIU_AGENT_API_TOKEN}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5000}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  visitor-db:
