name: No-model reproduction checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: chance_test
          POSTGRES_DB: chance_test
          POSTGRES_PASSWORD: ci-only-disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chance_test -d chance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CHANCE_TEST_DATABASE_URL: postgresql://chance_test:ci-only-disposable@127.0.0.1:5432/chance_test
      MENGNIU_ALLOW_MODEL_CALLS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r backend/portable/requirements.lock
      - run: python -m unittest discover -s backend/tests -v
      - run: npm test && npm run build
      - run: python scripts/verify_publication.py
      - name: Build standalone images (no inference)
        run: |
          docker build -t chance-backend:test backend
          docker build -t chance-web:test .
